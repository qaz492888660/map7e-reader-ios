name: Bootstrap iOS repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap importer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy MAP7E Reader snapshot
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/qaz492888660/map7e-reader.git /tmp/map7e-reader
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/bootstrap-ios.yml' /tmp/map7e-reader/ ./
          rm -f .github/workflows/bootstrap-ios.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import MAP7E Reader snapshot for iOS"
          git push origin main
