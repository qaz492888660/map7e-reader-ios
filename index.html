<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/maple.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dfe7e6" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('map7e-reader:v1') || 'null')
        const openingNight =
          saved?.settings?.ambience === 'night' &&
          (!location.hash || /^#\/(home|settings|reader\/)/.test(location.hash))
        if (openingNight) {
          document.documentElement.dataset.ambience = 'night'
          document.querySelector('meta[name="theme-color"]').content = '#0b1420'
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="属于枫的私人阅读空间。在云间书架，收藏与阅读另一个世界。"
    />
    <title>MAP7E Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
